<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#3f9ef5" />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚀</text></svg>"
    />
    <title>Roadster Rush</title>
  </head>
  <body data-state="title">
    <div id="app"></div>

    <!-- In-game HUD; which parts show is driven by body[data-state] in style.css. -->
    <div id="hud">
      <div class="score-label">SCORE <span id="multiplier" class="multiplier hidden">×2</span></div>
      <div id="score">0</div>
      <div class="cells"><span class="cell-icon"></span><span id="cells">0</span></div>
    </div>
    <button id="pause-btn" class="icon-btn pause-btn" aria-label="Pause">
      <svg viewBox="0 0 24 24"><rect x="6" y="5" width="4" height="14" rx="1" /><rect x="14" y="5" width="4" height="14" rx="1" /></svg>
    </button>
    <div id="powerups"></div>
    <div id="popups"></div>
    <div id="countdown" class="countdown hidden"></div>
    <div id="tutorial-prompt" class="tutorial-prompt hidden">
      <div id="tutorial-arrow" class="tutorial-arrow"></div>
      <div id="tutorial-text" class="tutorial-text"></div>
      <div id="tutorial-key" class="tutorial-key"></div>
    </div>

    <div id="title-screen" class="screen">
      <div class="top-bar">
        <div class="pill"><span class="cell-icon"></span><span id="title-cells">0</span></div>
        <button id="settings-btn" class="icon-btn" aria-label="Settings">
          <svg viewBox="0 0 24 24"><path d="M12 8.5a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7Zm8.4 5-.1-3 2-1.6-2-3.4-2.4.9a8 8 0 0 0-2.6-1.5L14.9 2H9.1l-.4 2.9a8 8 0 0 0-2.6 1.5l-2.4-1-2 3.5 2 1.6a8 8 0 0 0 0 3l-2 1.6 2 3.4 2.4-.9a8 8 0 0 0 2.6 1.5l.4 2.9h5.8l.4-2.9a8 8 0 0 0 2.6-1.5l2.4.9 2-3.4-2-1.6Z" /></svg>
        </button>
      </div>
      <div class="title-main">
        <h1 class="logo">ROADSTER<span>RUSH</span></h1>
        <div class="best">BEST <span id="title-best">0</span></div>
      </div>
      <div class="title-bottom">
        <div class="tap-hint">TAP TO PLAY</div>
        <button id="garage-btn" class="btn btn-small btn-blue" disabled>GARAGE <span class="soon">SOON</span></button>
      </div>
    </div>

    <div id="pause-screen" class="screen dim off">
      <h2>PAUSED</h2>
      <button id="resume-btn" class="btn btn-green">RESUME</button>
      <div class="row">
        <button id="pause-settings-btn" class="btn btn-small btn-blue">SETTINGS</button>
        <button id="quit-btn" class="btn btn-small btn-dark">HOME</button>
      </div>
    </div>

    <div id="revive-screen" class="screen dim off">
      <h2 id="revive-title">CRASHED!</h2>
      <div class="revive-ask">CONTINUE?</div>
      <div id="revive-ring" class="revive-ring"><span id="revive-count"></span></div>
      <button id="revive-btn" class="btn btn-green">CONTINUE <span class="price">FREE</span></button>
      <button id="skip-revive-btn" class="link-btn">NO THANKS</button>
    </div>

    <div id="over-screen" class="screen dim off">
      <h2 id="over-title">CRASHED!</h2>
      <div class="over-layout">
        <div class="panel">
          <div id="new-best" class="new-best hidden">NEW BEST!</div>
          <div id="final-score" class="final-score">0</div>
          <div class="best">BEST <span id="over-best">0</span></div>
          <ul class="breakdown">
            <li><span>DISTANCE</span><span id="bd-distance">0 m</span></li>
            <li><span>NEAR MISSES ×<span id="bd-near-count">0</span></span><span id="bd-near">+0</span></li>
            <li id="bd-bonus-row"><span>×2 BONUS</span><span id="bd-bonus">+0</span></li>
            <li><span><span class="cell-icon"></span>CELLS</span><span>+<span id="run-cells">0</span></span></li>
          </ul>
        </div>
        <div class="over-actions">
          <button id="retry-btn" class="btn btn-green">PLAY AGAIN</button>
          <button id="home-btn" class="btn btn-small btn-dark">HOME</button>
        </div>
      </div>
    </div>
    <div id="confetti" class="confetti"></div>

    <div id="settings-screen" class="screen modal off" role="dialog" aria-label="Settings">
      <div class="panel settings">
        <h2>SETTINGS</h2>
        <label class="setting"><span>MUSIC</span><input id="set-music" type="range" min="0" max="100" /></label>
        <label class="setting"><span>SOUND FX</span><input id="set-sfx" type="range" min="0" max="100" /></label>
        <div class="setting"><span>VIBRATION</span><button id="set-vibration" class="toggle" role="switch" aria-label="Vibration"></button></div>
        <div class="setting">
          <span>GRAPHICS</span>
          <div id="set-quality" class="segmented">
            <button data-value="auto">AUTO</button><button data-value="high">HIGH</button><button data-value="low">LOW</button>
          </div>
        </div>
        <div class="setting"><span>TUTORIAL</span><button id="set-tutorial" class="toggle" role="switch" aria-label="Tutorial"></button></div>
        <button id="settings-close" class="btn btn-small">DONE</button>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
